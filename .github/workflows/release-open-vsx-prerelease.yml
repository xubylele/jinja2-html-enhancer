name: Release Open VSX Extension Pre-release

on:
  push:
    branches:
      - pre-release
    paths:
      - package.json
      - CHANGELOG.md
  workflow_dispatch:

jobs:
  release:
    name: Build, Lint, Package, and Publish Pre-release to Open VSX
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - name: Install vsce
        run: pnpm add -g @vscode/vsce

      - name: Install ovsx
        run: pnpm add -g ovsx

      - name: Build extension
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Package VSIX
        run: vsce package --no-dependencies --pre-release

      - name: Get VSIX filename
        id: vsix
        run: echo "file=$(ls *.vsix)" >> $GITHUB_OUTPUT

      - name: Publish Open VSX Pre-release
        if: github.ref_name == 'pre-release'
        run: ovsx publish "${{ steps.vsix.outputs.file }}" --pre-release -p "${{ secrets.OVSX_PAT }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema-forge-vsix-open-vsx-${{ github.ref_name }}-${{ github.sha }}
          path: "*.vsix"
