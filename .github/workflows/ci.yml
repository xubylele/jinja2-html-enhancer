name: CI

on:
  pull_request:
    branches:
      - main
      - pre-release
      - develop
  push:
    branches:
      - main

jobs:
  ci:
    name: Test & Changeset Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test:ci

      - name: Fail if changeset files exist (PR → main/pre*)
        if: github.base_ref == 'main' || startsWith(github.base_ref, 'pre')
        run: |
          files=$(find .changeset -name "*.md" ! -name "README.md")
          if [ -n "$files" ]; then
            echo "::error::Changeset files found. Consume them before merging to ${{ github.base_ref }}."
            echo "$files"
            exit 1
          fi

      - name: Fail if no changeset (PR → develop)
        if: github.base_ref == 'develop' && github.head_ref != 'pre-release' &&
          github.head_ref != 'main'
        run: pnpm changeset:check

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Install vsce
        run: pnpm add -g @vscode/vsce

      - name: Package extension
        run: pnpm package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: jinja2-html-enhancer-vsix-${{ github.sha }}
          path: "*.vsix"
