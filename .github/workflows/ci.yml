name: CI

on:
  pull_request:
    branches:
      - main
      - pre-release
      - develop
  push:
    branches:
      - main

jobs:
  ci:
    name: Test & Changeset Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Fail if changeset files exist (PR → main/pre*)
        if: github.base_ref == 'main' || startsWith(github.base_ref, 'pre')
        run: |
          files=$(find .changeset -name "*.md" ! -name "README.md")
          if [ -n "$files" ]; then
            echo "::error::Changeset files found. Consume them before merging to ${{ github.base_ref }}."
            echo "$files"
            exit 1
          fi

      - name: Fail if no changeset (PR → develop)
        if: github.base_ref == 'develop' && github.head_ref != 'pre-release' && github.head_ref != 'main'
        run: npm run changeset:check

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: npm run package

      - name: Get VSIX filename
        id: vsix
        run: echo "file=$(ls *.vsix)" >> $GITHUB_OUTPUT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: jinja2-html-enhancer-vsix-${{ github.sha }}
          path: ${{ steps.vsix.outputs.file }}
